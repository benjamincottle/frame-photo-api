[package]
name = "photo_api"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.11"
log = "0.4.34"
postgres = "0.19.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
# Only used to set options on the listening socket; see `bind_listener` in main.rs.
socket2 = { version = "0.6.5", features = ["all"] }
