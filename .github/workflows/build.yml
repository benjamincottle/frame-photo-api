name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/build.yml
  schedule:
    # Daily upstream-digest check for gcr.io/distroless/cc-debian13
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_IMAGE: gcr.io/distroless/cc-debian13
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/frame-photo-api
  DIGEST_FILE: .cache/upstream-digest

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore last-known upstream digest
        uses: actions/cache@v4
        with:
          path: ${{ env.DIGEST_FILE }}
          key: upstream-digest-${{ github.run_id }}
          restore-keys: |
            upstream-digest-

      - name: Get upstream image digest
        id: upstream
        run: |
          digest="$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare against last-known digest
        id: compare
        run: |
          stored=""
          if [ -f "$DIGEST_FILE" ]; then
            stored="$(cat "$DIGEST_FILE")"
          fi
          if [ "$stored" = "${{ steps.upstream.outputs.digest }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest

      - name: Record upstream digest for cache
        run: |
          mkdir -p "$(dirname "$DIGEST_FILE")"
          echo "${{ steps.upstream.outputs.digest }}" > "$DIGEST_FILE"

      - name: Keep scheduled trigger alive
        run: |
          age_days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$age_days" -gt 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "chore: keepalive commit to prevent scheduled workflow disable"
            git push
          fi
