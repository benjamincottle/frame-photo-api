name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/build.yml
  schedule:
    # Daily upstream-digest check for gcr.io/distroless/cc-debian13:nonroot.
    - cron: '17 16 * * *'
  workflow_dispatch: {}

# Cancel a superseded run, but keep push/schedule/dispatch runs from
# cancelling each other since they aren't racing on the same trigger.
# Keyed on github.workflow (not a hardcoded name) so it can't collide with
# another workflow file's concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

env:
  UPSTREAM_IMAGE: gcr.io/distroless/cc-debian13:nonroot
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DIGEST_FILE: .cache/upstream-digest

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore last-known upstream digest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIGEST_FILE }}
          key: upstream-digest-${{ github.run_id }}
          restore-keys: |
            upstream-digest-

      - name: Get upstream image digest
        id: upstream
        run: |
          digest="$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare against last-known digest
        id: compare
        run: |
          stored=""
          if [ -f "$DIGEST_FILE" ]; then
            stored="$(cat "$DIGEST_FILE")"
          fi
          if [ "$stored" = "${{ steps.upstream.outputs.digest }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record upstream digest for cache
        run: |
          mkdir -p "$(dirname "$DIGEST_FILE")"
          echo "${{ steps.upstream.outputs.digest }}" > "$DIGEST_FILE"
